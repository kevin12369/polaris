<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北极星 Polaris · 客服工单管理平台（演示）</title>
<meta name="description" content="Polaris 北极星 —— 客服工单管理平台演示页，含仪表盘、工单、知识库与 AI 排障助手。">
<style>/* ============================================================
   Polaris 演示页 · 样式
   设计令牌复用主应用 frontend/src/styles.css 的 :root，
   保证演示页与真产品看起来是同一个东西。
   ============================================================ */
:root{
--bg:#0d1117;--bg-elev:#131920;--bg-elev-2:#1a212b;--bg-hover:#1e2731;--bg-input:#0f151c;
--border:#232c38;--border-strong:#2e3947;
--text:#e6edf3;--text-dim:#9aa7b4;--text-mute:#6b7885;
--accent:#5b7cfa;--accent-hover:#6d8bff;--accent-dim:rgba(91,124,250,.14);--accent-border:rgba(91,124,250,.4);
--p1:#f2555a;--p2:#f59e4b;--p3:#4aa3f0;--p4:#6b7885;--ok:#3fb950;--warn:#d29922;--danger:#f2555a;
--radius:8px;--radius-sm:5px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.88);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:0 22px;height:58px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(91,124,250,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-name{font-size:14px;font-weight:600}
.brand-sub{font-size:11px;color:var(--text-mute)}
.nav{display:flex;align-items:center;gap:2px;margin-left:6px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.nav-item{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--radius-sm);color:var(--text-dim);font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer;border:1px solid transparent;background:none;font-family:inherit}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.9;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang-btn{height:30px;padding:0 11px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg-elev-2);color:var(--accent);font-family:var(--mono);font-size:12px;cursor:pointer}
.lang-btn:hover{border-color:var(--accent-border);color:var(--text)}
/* ---------- 页面容器 ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:22px}
.page{display:none}
.page.active{display:block;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.page-head .sub{color:var(--text-mute);font-size:12.5px}
.mt{margin-top:14px}
/* ---------- 卡片 / 按钮 / 徽章 ---------- */
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-bottom:1px solid var(--border)}
.card-head h3{margin:0;font-size:13.5px;font-weight:600}
.card-body{padding:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-elev-2);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--bg-hover);border-color:#3a4756}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{height:27px;padding:0 10px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge-p1{background:rgba(242,85,90,.13);color:var(--p1);border-color:rgba(242,85,90,.3)}
.badge-p2{background:rgba(245,158,75,.13);color:var(--p2);border-color:rgba(245,158,75,.3)}
.badge-p3{background:rgba(74,163,240,.13);color:var(--p3);border-color:rgba(74,163,240,.3)}
.badge-p4{background:rgba(107,120,133,.15);color:var(--p4);border-color:rgba(107,120,133,.3)}
.badge-ok{background:rgba(63,185,80,.13);color:var(--ok);border-color:rgba(63,185,80,.3)}
.badge-warn{background:rgba(210,153,34,.13);color:var(--warn);border-color:rgba(210,153,34,.3)}
.badge-info{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)}
.badge-mute{background:var(--bg-elev-2);color:var(--text-mute);border-color:var(--border)}
.row{display:flex;align-items:center;gap:8px}
.gap6{gap:6px}.gap7{gap:7px}.gap8{gap:8px}.wrap{flex-wrap:wrap}
.mb12{margin-bottom:12px}.mt3{margin-top:3px}.sm{font-size:12px}.full{grid-column:1/-1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--text-mute)}
.dim{color:var(--text-dim)}
.mono{font-family:var(--mono);font-size:12px}
.tiny{font-size:11.5px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim)}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
/* ---------- 仪表盘 ---------- */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{padding:14px 16px}
.metric-label{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.metric-value{margin:7px 0 4px;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.metric-unit{margin-left:3px;font-size:13px;font-weight:500;color:var(--text-mute)}
.metric-sub{font-size:11.5px}
.tone-accent{color:var(--accent)}.tone-ok{color:var(--ok)}.tone-danger{color:var(--danger)}
.trend-chart{width:100%;height:auto;display:block}
.dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bar-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.bar-label{width:92px;flex-shrink:0;font-size:12.5px;color:var(--text-dim)}
.bar-track{flex:1;height:6px;border-radius:3px;background:var(--bg-elev-2);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s ease}
.bar-fill.alt{background:#8b5cf6}
.bar-val{width:26px;text-align:right;font-size:12px;color:var(--text-dim);font-family:var(--mono)}
/* ---------- 工单 ---------- */
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;min-width:880px}
table.data th{padding:9px 12px;text-align:left;font-size:11.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
table.data td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tbody tr.tk-row{cursor:pointer;transition:background .12s}
table.data tbody tr.tk-row:hover{background:var(--bg-elev-2)}
table.data tbody tr.tk-row.sel{background:var(--accent-dim)}
table.data tbody tr.tk-row.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.requester{font-size:11.5px;margin-top:2px;color:var(--text-mute)}
.overdue{color:var(--danger);font-weight:600}
.soon{color:var(--warn)}
.detail-row td{background:var(--bg);padding:0}
.detail-wrap{display:grid;grid-template-columns:250px 210px minmax(0,1fr);gap:14px;padding:15px}
.detail-sec{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elev);padding:11px 12px}
.detail-sec h4{margin:0 0 9px;font-size:11.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em}
.sla-item{padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--border)}
.sla-item:last-of-type{border-bottom:none;margin-bottom:0}
.sla-value{margin:5px 0 2px;font-size:16px;font-weight:600;font-family:var(--mono)}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-danger{color:var(--danger)}
.sla-meta{font-size:11px;color:var(--text-mute);line-height:1.55}
.flow-note{width:100%;padding:7px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;outline:none;resize:vertical;min-height:56px;line-height:1.6}
.flow-note:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-dim)}
.flow-note::placeholder,.ai-input::placeholder{color:var(--text-mute)}
.flow-btns{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.event{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)}
.event:last-child{border-bottom:none}
.event-dot{width:7px;height:7px;flex-shrink:0;margin-top:6px;border-radius:50%;background:var(--text-mute)}
.ev-created{background:var(--accent)}.ev-status{background:var(--ok)}.ev-kb{background:#a371f7}.ev-comment{background:var(--warn)}
.actor{font-size:12.5px}
.event-note{margin-top:3px;font-size:12.5px;color:var(--text-dim);line-height:1.55}
/* ---------- 知识库 ---------- */
.kb-grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px;align-items:start}
.kb-list{overflow-y:auto;max-height:calc(100vh - 160px)}
.kb-row{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.kb-row:last-child{border-bottom:none}
.kb-row:hover{background:var(--bg-elev-2)}
.kb-row.active{background:var(--accent-dim)}
.kb-row-title{font-size:13px;font-weight:500;line-height:1.45}
.kb-row-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.kb-row-sum{margin-top:4px;font-size:11.5px;color:var(--text-mute);line-height:1.5}
.kb-summary{padding:10px 12px;margin-bottom:13px;border-radius:var(--radius-sm);background:var(--bg-elev-2);border-left:2px solid var(--accent);font-size:12.5px;color:var(--text-dim);line-height:1.65}
.kb-steps-box summary{cursor:pointer;font-size:11.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em;list-style:none;padding:5px 0}
.kb-steps-box summary::-webkit-details-marker{display:none}
.kb-steps-box summary::before{content:"▸";display:inline-block;margin-right:6px;color:var(--accent)}
.kb-steps-box[open] summary::before{content:"▾"}
.kb-steps{margin:8px 0 0;padding-left:20px;font-size:13px}
.kb-steps li{margin-bottom:9px;line-height:1.6}
.kb-steps li::marker{color:var(--accent);font-weight:600}
.kb-content{margin-top:13px;padding-top:13px;border-top:1px solid var(--border);white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text-dim)}
/* ---------- AI 排障 ---------- */
.ai-grid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:14px;align-items:start}
.ai-input{width:100%;padding:9px 11px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.65;outline:none;resize:vertical;min-height:130px}
.ai-input:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-dim)}
.sample{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elev-2);color:var(--text-dim);font-family:var(--mono);font-size:11.5px;line-height:1.5;cursor:pointer}
.sample:hover{border-color:var(--accent-border);color:var(--text);background:var(--bg-hover)}
.summary{font-size:13.5px;line-height:1.75}
.aisteps{margin:0;padding:0;list-style:none}
.aisteps li{padding:11px 0;border-bottom:1px solid var(--border)}
.aisteps li:last-child{border-bottom:none}
.step-title{display:flex;align-items:center;gap:9px;font-size:13.5px}
.step-no{width:20px;height:20px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-border);color:var(--accent);font-size:11px;font-weight:600}
.step-detail{margin-top:5px;padding-left:29px;font-size:13px;line-height:1.7;color:var(--text-dim)}
.step-src{margin-top:4px;padding-left:29px;font-size:11.5px;color:var(--text-mute)}
.matched{padding:10px 0;border-bottom:1px solid var(--border)}
.matched:last-child{border-bottom:none}
.matched-title{font-size:13px;font-weight:500}
.terms{margin-top:4px;font-size:11.5px;color:var(--text-mute)}
.terms code{font-family:var(--mono);color:var(--text-dim);background:var(--bg-elev-2);padding:1px 5px;border-radius:3px;margin-right:4px;display:inline-block}
.stack{display:flex;flex-direction:column;gap:14px}
/* ---------- 页脚 ---------- */
.footer{border-top:1px solid var(--border);margin-top:26px}
.footer-inner{max-width:1400px;margin:0 auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-mute)}
.footer a{font-family:var(--mono);font-size:11.5px}
/* ---------- 响应式 ---------- */
@media (max-width:1180px){.metric-grid{grid-template-columns:repeat(2,1fr)}.ai-grid{grid-template-columns:1fr}.detail-wrap{grid-template-columns:1fr 1fr}}
@media (max-width:980px){.kb-grid{grid-template-columns:1fr}.kb-list{max-height:340px}.dist-grid{grid-template-columns:1fr}}
@media (max-width:760px){.topbar-inner{height:auto;padding:10px 14px;flex-wrap:wrap;gap:10px}
.brand{order:1}.topbar-right{order:2}.nav{order:3;width:100%;margin-left:0}.nav-item{flex:0 0 auto}
.wrap{padding:14px}.metric-grid{grid-template-columns:1fr}.detail-wrap{grid-template-columns:1fr}
.page-head h1{font-size:17px}.footer-inner{flex-direction:column;align-items:flex-start;gap:6px}}
</style>
</head>
<body>
<!-- ============================ 顶栏 ============================ -->
<header class="topbar">
<div class="topbar-inner">
<div class="brand">
<div class="brand-mark">✦</div>
<div class="brand-text">
<div class="brand-name" data-i18n="brand.name"></div>
<div class="brand-sub" data-i18n="brand.sub"></div>
</div></div>
<nav class="nav" id="nav">
<button class="nav-item active" data-page="dashboard"><svg viewBox="0 0 16 16"><path d="M2 9.2 8 2.5l6 6.7M3.6 8v5.2h8.8V8"/></svg><span data-i18n="nav.dashboard"></span></button>
<button class="nav-item" data-page="tickets"><svg viewBox="0 0 16 16"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="2"/><path d="M2.2 5.8h11.6M5.8 5.8v8"/></svg><span data-i18n="nav.tickets"></span></button>
<button class="nav-item" data-page="kb"><svg viewBox="0 0 16 16"><path d="M3 2.6h4.6v11H3zM13 2.6H8.4v11H13z"/></svg><span data-i18n="nav.kb"></span></button>
<button class="nav-item" data-page="assistant"><svg viewBox="0 0 16 16"><path d="M8 1.8 9.4 5.9 13.6 7.3 9.4 8.7 8 12.8 6.6 8.7 2.4 7.3 6.6 5.9z"/></svg><span data-i18n="nav.assistant"></span></button>
</nav>
<div class="topbar-right">
<button class="lang-btn" id="langBtn" title="中 / EN"><span id="langLabel">EN</span></button>
</div></div></header>

<main class="wrap">
<!-- ============================ 仪表盘 ============================ -->
<section class="page active" id="page-dashboard">
<div class="page-head">
<div><h1 data-i18n="dash.title"></h1><div class="sub" data-i18n="dash.range"></div></div>
</div>
<div class="metric-grid" id="metricGrid"></div>
<div class="card mt">
<div class="card-head"><h3 data-i18n="chart.title"></h3>
<div class="row" style="gap:12px">
<span class="legend"><i style="background:var(--accent)"></i><span data-i18n="chart.created"></span></span>
<span class="legend"><i style="background:var(--ok)"></i><span data-i18n="chart.resolved"></span></span></div></div>
<div class="card-body">
<svg id="trendChart" class="trend-chart" viewBox="0 0 760 210" role="img" aria-label="ticket trend"></svg>
<div class="row-between tiny muted" style="margin-top:6px">
<span data-i18n="chart.note"></span></div></div></div>
<div class="dist-grid">
<div class="card"><div class="card-head"><h3 data-i18n="chart.cat"></h3></div><div class="card-body" id="catBars"></div></div>
<div class="card"><div class="card-head"><h3 data-i18n="chart.status"></h3></div><div class="card-body" id="statusBars"></div></div>
</div></section>

<!-- ============================ 工单 ============================ -->
<section class="page" id="page-tickets">
<div class="page-head">
<div><h1 data-i18n="t.title"></h1></div>
<div class="row" style="gap:8px">
</div></div>
<div class="card"><div class="table-wrap"><table class="data">
<thead><tr>
<th style="width:88px" data-i18n="t.th.code"></th>
<th data-i18n="t.th.title"></th>
<th style="width:92px" data-i18n="t.th.pri"></th>
<th style="width:104px" data-i18n="t.th.cat"></th>
<th style="width:96px" data-i18n="t.th.status"></th>
<th style="width:134px" data-i18n="t.th.sla"></th>
<th style="width:62px" data-i18n="t.th.kb"></th>
</tr></thead><tbody id="ticketBody"></tbody></table></div></div></section>

<!-- ============================ 知识库 ============================ -->
<section class="page" id="page-kb">
<div class="page-head">
<div><h1 data-i18n="kb.title"></h1><div class="sub" id="kbSub"></div></div>
<span class="badge badge-info" data-i18n="kb.bm25"></span></div>
<div class="kb-grid">
<div class="kb-list card" id="kbList"></div>
<div class="kb-detail card" id="kbDetail"></div></div></section>

<!-- ============================ AI 排障 ============================ -->
<section class="page" id="page-assistant">
<div class="page-head">
<div><h1 data-i18n="ai.title"></h1><div class="sub" data-i18n="ai.sub"></div></div>
<span class="badge badge-mute" data-i18n="ai.localEngine"></span></div>
<div class="ai-grid">
<div class="stack">
<div class="card"><div class="card-head"><h3 data-i18n="ai.input"></h3></div>
<div class="card-body">
<textarea id="aiText" class="ai-input" spellcheck="false"></textarea>
<div class="row-between" style="margin-top:10px">
<span class="tiny muted" data-i18n="ai.hint"></span>
<button class="btn btn-primary" id="aiRun" data-i18n="ai.run"></button></div></div></div>
<div class="card"><div class="card-head"><h3 data-i18n="ai.samples"></h3></div>
<div class="card-body" id="aiSamples"></div></div></div>
<div class="stack" id="aiOut"></div></div></section>
</main>

<!-- ============================ 页脚 ============================ -->
<footer class="footer"><div class="footer-inner">
<span data-i18n="footer.note"></span>
<span><span data-i18n="footer.repo"></span>: <a href="https://github.com/kevin12369/polaris" rel="noopener">https://github.com/kevin12369/polaris</a></span>
</div></footer>

<script>
/* ============================================================
   1. 语言字典 —— 界面文案的唯一来源
   每条写作「中文|English」，L() 按当前语言取半边
   ============================================================ */
var DICT={
'brand.name':'北极星 Polaris|Polaris',

/* 7. 工具函数 */
var lang='zh';
/** 解析 '中文|English' 形式的双语字符串 */
function L(s){ if(s==null) return '';
var i=s.indexOf('|'); return i<0?s:(lang=='zh'?s.slice(0,i):s.slice(i+1)); }
/** 模板替换：{{key}} 取字典 */
function T(str){ return str.replace(/\{\{(\w[\w.]*)\}\}/g,function(m,k){ return L(DICT[k]); }); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/** 徽章 */
function badge(t,tone){ return '<span class="badge badge-'+tone+'">'+esc(t)+'</span>'; }
/** 分钟数 → 「3小时12分」/「3h12m」 */
function fmtMinutes(mins){
if(mins==null) return '—';
var m=Math.abs(Math.round(mins)),h=Math.floor(m/60),r=m%60,d=Math.floor(h/24),rh=h%24;
if(lang=='en') return m<60?m+'m':h<24?(r?h+'h'+r+'m':h+'h'):(rh?d+'d'+rh+'h':d+'d');
return m<60?m+'分钟':h<24?(r?h+'小时'+r+'分':h+'小时'):(rh?d+'天'+rh+'小时':d+'天'); }
/** 剩余时间 → 「剩 3小时12分」/「已超时 2小时」 */
function fmtRemaining(m){
if(m==null) return lang=='en'?'Completed':'已完成';
if(m<0) return (lang=='en'?'Overdue ':'已超时 ')+fmtMinutes(m);
return (lang=='en'?'in ':'剩 ')+fmtMinutes(m); }
function articleById(id){ for(var i=0;i<KB.length;i++) if(KB[i].id==id) return KB[i]; return KB[0]; }

/** 手绘 SVG 折线图：JS 计算 path 的 d 属性 */
function renderTrend(){
var W=760,H=210,pL=34,pR=14,pT=12,pB=28,iW=W-pL-pR,iH=H-pT-pB,i,y,s=[];
var max=Math.max(2,Math.max.apply(null,TREND.map(function(d){return Math.max(d.created,d.resolved);})));
var st=iW/(TREND.length-1);
function X(j){ return pL+j*st; }
function Y(v){ return pT+iH-v/max*iH; }
function pts(k){ return TREND.map(function(d,j){return X(j).toFixed(1)+','+Y(d[k]).toFixed(1);}).join(' '); }
for(i=1;i<=4;i++){ y=Y(max*(4-i)/3);
s.push('<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#232c38"/>');
s.push('<text x="'+(pL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" fill="#6b7885" font-size="10" font-family="monospace">'+Math.round(max*(4-i)/3)+'</text>');}
s.push('<path d="M '+pL+','+(pT+iH)+' L '+TREND.map(function(d,j){return X(j).toFixed(1)+','+Y(d.created).toFixed(1);}).join(' L ')+' L '+X(TREND.length-1).toFixed(1)+','+(pT+iH)+' Z" fill="rgba(91,124,250,.13)"/>');
[['resolved','#3fb950','4 3'],['created','#5b7cfa','']].forEach(function(c){
s.push('<polyline points="'+pts(c[0])+'" fill="none" stroke="'+c[1]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(c[2]?' stroke-dasharray="'+c[2]+'"':'')+'/>');});
TREND.forEach(function(d,j){ /* 稀疏数据下标出数据点更易读 */
if(d.created) s.push('<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(d.created).toFixed(1)+'" r="2.6" fill="#5b7cfa"/>');
if(d.resolved) s.push('<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(d.resolved).toFixed(1)+'" r="2.6" fill="#3fb950"/>');});
for(i=0;i<TREND.length;i+=5)
s.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" fill="#6b7885" font-size="10" font-family="monospace">'+TREND[i].date+'</text>');
document.getElementById('trendChart').innerHTML=s.join('');}

/** 把预置结果组装成可渲染结构（步骤引用知识库条目，上限 5 步） */

var r=e.target.closest('.kb-row'); if(r){ selKb=r.getAttribute('data-kb'); renderKb(); }});
/* AI 排障：示例按钮 + 生成按钮 + Ctrl+Enter */
document.getElementById('aiSamples').addEventListener('click',function(e){
var b=e.target.closest('[data-preset]'); if(!b) return;
var p=PRESETS[+b.getAttribute('data-preset')];
document.getElementById('aiText').value=L(p.q);
assistantResult=buildResult(p); renderAssistant();});
document.getElementById('aiRun').addEventListener('click',function(){
var btn=document.getElementById('aiRun');
btn.disabled=true; btn.textContent=L(DICT['ai.running']);
setTimeout(function(){ assistantResult=buildResult(currentPreset(),document.getElementById('aiText').value);
renderAssistant(); btn.disabled=false; btn.textContent=L(DICT['ai.run']); },240);});
document.getElementById('aiText').addEventListener('keydown',function(e){
if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); document.getElementById('aiRun').click(); }});

/* 14. 启动：默认展示 502 示例的排查结果 */
assistantResult=buildResult(PRESETS[0]);
applyI18n();
</script>
