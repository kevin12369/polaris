name: Weekly Health Check

# 每周一早上跑一次完整验证。
#
# 目的不是"保持绿灯好看"，而是尽早发现问题：
#   - 依赖更新后某个测试挂了
#   - 基础镜像或 Python 版本变化导致行为漂移
#   - 演示页被误改坏
#
# 失败时会自动开一个 issue —— 这比让维护者每周手动去看要可靠。

on:
  schedule:
    # 每周一 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: 完整验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 单元测试
        working-directory: backend
        run: |
          python tests/test_sla.py
          python tests/test_retrieval.py

      - name: 端到端测试
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/sw-health-test.db
          DATA_DIR: /tmp/sw-health-data
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 \
            > /tmp/uvicorn.log 2>&1 &
          Uvicorn_PID=$!
          trap "kill $Uvicorn_PID 2>/dev/null || true" EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8100/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "服务启动失败："; cat /tmp/uvicorn.log; exit 1
          fi
          python tests/test_e2e.py

      - name: 前端构建
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 演示页自检
        run: |
          # 演示页必须零外部依赖，否则离线打开会坏掉
          if grep -qE '(src|href)="https?://' demo/index.html; then
            echo "::error::演示页引用了外部资源，违反零依赖约定"
            grep -oE '(src|href)="https?://[^"]*"' demo/index.html
            exit 1
          fi
          if [ ! -f demo/index.html ]; then
            echo "::error::演示页缺失"; exit 1
          fi
          echo "演示页检查通过（$(wc -c < demo/index.html) 字节，零外部依赖）"

      - name: 失败时自动开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] 每周健康检查失败 — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '每周健康检查未通过，说明依赖漂移或环境变化引入了问题。',
              '',
              `**运行链接**：${context.serverUrl}/${context.repo.owner.repo}/actions/runs/${context.runId}`,
              '',
              '请查看日志定位问题。如果这是已知问题，可以直接关闭本 issue。',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['type: ci', 'bug'],
            });
