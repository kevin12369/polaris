name: Bug 报告
description: 报告一个可复现的问题 —— 功能异常、报错、行为与预期不符
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你发现问题！填写前请先做两件事，能省下大量来回沟通：

        1. **搜索一下已有 Issue** —— 同一个问题可能已经被报告过了。
        2. **确认不是部署问题** —— 首次部署请先看
           [部署指南](https://github.com/kevin12369/polaris/blob/main/docs/部署指南.md)
           的「常见问题」章节。

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步写，每一步都要能被别人照着做出来。编号列出最好。
      placeholder: |
        1. 用管理员账号登录，进入「工单」列表页
        2. 点击任意一张状态为「处理中」的工单
        3. 在右侧备注框输入「测试备注」并提交
        4. 页面卡住约 3 秒后跳转到错误页
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么。
      placeholder: 备注提交成功后，页面刷新并显示刚提交的备注内容。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？看到什么报错？尽量把错误信息原文写出来。
      placeholder: |
        页面卡住后跳转到 /error，控制台报 500。
        后端日志：KeyError: 'status_label'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Polaris 版本
      description: 可在 `/api/health` 接口的返回里看到 `version` 字段；本地开发填 `main` 即可。
      placeholder: "v1.0.0（或 git log -1 --format=%h）"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker Compose（docker compose up -d --build）
        - 本地开发（uvicorn + vite dev）
        - 其他
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器
      description: 涉及界面表现时填写，例如 `Chrome 131 / Windows 11`。纯后端问题可填「不涉及」。
      placeholder: "Chrome 131 / Windows 11"
    validations:
      required: false

  - type: input
    id: runtime
    attributes:
      label: Python / Node 版本
      description: 本地开发时填写；Docker 部署填镜像内的版本即可（Python 3.12 / Node 22）。
      placeholder: "Python 3.12.3 / Node 22.9.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        粘贴相关日志，**请务必先脱敏**：

        - 把客户真实邮箱、手机号、公司名替换成 `xxx@example.com` 之类
        - 把报错原文里的业务数据替换掉
        - 把 `Authorization: Bearer ...` 和 token 整段删掉
        - 只贴与问题相关的片段，不用贴完整日志

        获取日志：`docker compose logs -f backend`
      placeholder: |
        [ERROR] ... KeyError: 'status_label'
        (已脱敏)
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 影响范围
      description: 这个问题影响到谁、有多严重？
      options:
        - 阻塞 —— 功能完全不可用，或数据丢失/损坏
        - 严重 —— 核心流程受影响，但没有绕行方案
        - 一般 —— 功能异常，但能手动绕开
        - 轻微 —— 界面显示、文案、体验问题
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: 受影响的对象
      description: 哪些人/哪种部署会碰到这个问题？例如「所有使用 Docker 部署的用户」、
        「只有 admin 角色会遇到」、「只有中文界面会乱码」。
      placeholder: 所有通过 Docker Compose 部署并使用「添加坐席」功能的管理员。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复问题
          required: true
        - label: 我已阅读并对日志做了脱敏
          required: true
